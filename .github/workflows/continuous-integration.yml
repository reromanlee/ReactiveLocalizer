name: Continuous integration

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.jpg'
      - '**.png'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.jpg'
      - '**.png'
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The test runner reports its results as a check run.
  checks: write

# A Personal license needs UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD; a Pro license UNITY_SERIAL instead of the first.
env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  dotnet:
    name: Pure assemblies on .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Builds the core and authoring assemblies from the package sources, with warnings as errors, and runs their tests.
      - name: Build and test the pure assemblies
        run: dotnet test DotNet/ReactiveLocalizer.slnx --configuration Release

  tests:
    name: Tests on ${{ matrix.unityVersion }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2022.3.62f3
          - 6000.5.11f1
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without it, Unity takes the project for a new one and adds its template packages to the manifest. Unity 6 also
      # refuses to open a project without an Assets folder, which git doesn't keep while it's empty.
      - name: Set the Unity version of the project
        env:
          UNITY_VERSION: ${{ matrix.unityVersion }}
        run: |
          mkdir -p UnityProject/ProjectSettings UnityProject/Assets
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Restore the Library folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: UnityProject/Library
          key: Library-tests-${{ matrix.unityVersion }}-${{ hashFiles('UnityPackage/**', 'UnityProject/**') }}
          restore-keys: Library-tests-${{ matrix.unityVersion }}-

      - name: Run the edit and play mode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          # Code coverage crashes play mode tests on Unity 6, see game-ci/unity-test-runner#301. The action's
          # coverageEnabled input passes --no-coverageEnabled, which the CLI rejects, so it's turned off here instead.
          GAME_CI_COVERAGE_ENABLED: false
        with:
          unityVersion: ${{ matrix.unityVersion }}
          cliVersion: v0.1.69
          projectPath: UnityProject
          testMode: all
          githubToken: ${{ github.token }}
          checkName: Test results on ${{ matrix.unityVersion }}

      - name: Check that the package compiles without warnings
        if: always()
        run: |
          warnings=$(grep -hs "warning CS" artifacts/*.log | grep -e "com.reromanlee.reactivelocalizer" -e "UnityPackage" | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::The package compiled with warnings."
            exit 1
          fi

      - name: Upload the test results and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test results on ${{ matrix.unityVersion }}
          path: artifacts

  builds:
    name: ${{ matrix.targetPlatform }} build on ${{ matrix.unityVersion }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 platforms on the oldest and the newest supported Unity. TextMeshPro is its own package on 2022.3
          # and part of uGUI on Unity 6; with it, the TextMeshPro sample compiles into every build.
          - unityVersion: 2022.3.62f3
            targetPlatform: WebGL
            samplePackages: '{"com.unity.textmeshpro": "3.0.9", "com.unity.ugui": "1.0.0"}'
          - unityVersion: 2022.3.62f3
            targetPlatform: Android
            samplePackages: '{"com.unity.textmeshpro": "3.0.9", "com.unity.ugui": "1.0.0"}'
          - unityVersion: 6000.5.11f1
            targetPlatform: WebGL
            samplePackages: '{"com.unity.ugui": "2.0.0"}'
          - unityVersion: 6000.5.11f1
            targetPlatform: Android
            samplePackages: '{"com.unity.ugui": "2.0.0"}'
          # Tier 2 platforms, checked to build on the newest Unity.
          - unityVersion: 6000.5.11f1
            targetPlatform: iOS
            samplePackages: '{"com.unity.ugui": "2.0.0"}'
          - unityVersion: 6000.5.11f1
            targetPlatform: StandaloneOSX
            samplePackages: '{"com.unity.ugui": "2.0.0"}'
          - unityVersion: 6000.5.11f1
            targetPlatform: StandaloneLinux64
            samplePackages: '{"com.unity.ugui": "2.0.0"}'
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without it, Unity takes the project for a new one and adds its template packages to the manifest.
      - name: Set the Unity version of the project
        env:
          UNITY_VERSION: ${{ matrix.unityVersion }}
        run: |
          mkdir -p UnityProject/ProjectSettings UnityProject/Assets
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > UnityProject/ProjectSettings/ProjectVersion.txt

      # Leaves only built-in modules, the local package and what the samples need, so a build never waits on the
      # registry for test-only packages.
      - name: Swap the test-only packages for the samples' ones
        env:
          SAMPLE_PACKAGES: ${{ matrix.samplePackages }}
        run: |
          manifest=UnityProject/Packages/manifest.json
          jq --argjson packages "$SAMPLE_PACKAGES" 'del(.dependencies["com.unity.test-framework.performance"]) | del(.testables) | .dependencies += $packages' "$manifest" > manifest.tmp
          mv manifest.tmp "$manifest"

      - name: Add the package samples to the project
        run: cp -r UnityPackage/Samples~ UnityProject/Assets/Samples

      # Only checks that the player builds; nothing is uploaded or released.
      - name: Build the Quick Start sample
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        with:
          unityVersion: ${{ matrix.unityVersion }}
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: UnityProject
          buildMethod: reromanlee.ReactiveLocalizer.ContinuousIntegration.PlayerBuild.Build
          versioning: None
